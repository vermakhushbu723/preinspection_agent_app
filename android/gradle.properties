org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround for a Kotlin 2.3.x Build-Tools-API bug where parallel, in-process
# ("no isolation") compilation of multiple Android library subprojects
# (video_player_android, shared_preferences_android, etc.) race on a shared
# static incremental-cache file registry, crashing with "Storage for [...]
# is already registered". Disabling Kotlin incremental compilation removes
# that cache path entirely; disabling Gradle project-level parallelism stops
# those subprojects' Kotlin compile tasks from running concurrently in the
# same daemon in the first place.
kotlin.incremental=false
org.gradle.parallel=false
